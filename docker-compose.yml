version: '3.9'

networks:
  external:
  internal:

volumes:
  neo4j_data:
  redis_data:

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - fastapi
    networks:
      - external
      - internal
    restart: unless-stopped

  fastapi:
    build:
      context: ./app
    command: uvicorn main:app --host 0.0.0.0 --port ${UVICORN_PORT:-8000}
    env_file: .env
    depends_on:
      - redis
      - neo4j
    networks:
      - internal
    restart: unless-stopped

  celery:
    build:
      context: ./app
    command: celery -A tasks worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - neo4j
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
    networks:
      - internal
    restart: unless-stopped
