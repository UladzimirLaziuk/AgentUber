version: '3.9'

networks:
  internal:

volumes:
  neo4j_data:
  redis_data:

services:
  landing:
    build:
      context: ./landing
    command: uvicorn main:app --host 0.0.0.0 --port ${UVICORN_PORT:-8000}
    env_file: .env
    ports:
      - "${UVICORN_PORT:-8000}:${UVICORN_PORT:-8000}"
    depends_on:
      - redis
      - neo4j
    networks:
      - internal
    restart: unless-stopped

  landing-worker:
    build:
      context: ./landing
    command: celery -A tasks worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - neo4j
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
    networks:
      - internal
    restart: unless-stopped
