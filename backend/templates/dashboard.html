<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentUber — Dashboard</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <header>
    <div class="logo">AgentUber</div>
    <div class="user-info">
      <span>{{ user.sub }}</span>
      <span class="role-badge {% if user.role == 'admin' %}admin{% endif %}">{{ user.role }}</span>
      <form class="logout" method="post" action="/logout">
        <button type="submit">Sign out</button>
      </form>
    </div>
  </header>

  <main>
    <h1>Dashboard</h1>
    <p class="subtitle">Welcome back, {{ user.sub }}.</p>

    <div class="cards">
      <div class="stat-card">
        <div class="label">Role</div>
        <div class="value">{{ user.role | capitalize }}</div>
      </div>
      <div class="stat-card">
        <div class="label">Status</div>
        <div class="value" style="color:#22c55e">Active</div>
      </div>
    </div>

    {% if user.role == 'admin' %}
    <div class="admin-section">
      <h2>Users</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Note</th>
            <th>Registered</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr class="loading-row"><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    {% endif %}
  </main>

  {% if user.role == 'admin' %}
  <script src="/static/js/dashboard.js"></script>
  {% endif %}
</body>
</html>
