<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentUber — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 560px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.875rem;
      border-radius: 999px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #7c3aed;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #a0a0a0;
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #22c55e;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .back {
      display: inline-block;
      margin-top: 2.5rem;
      color: #555;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back:hover { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Dashboard</span>
    <h1>You're in.</h1>
    <p>
      Your registration is being processed in the background.
      We'll be in touch once your account is ready.
    </p>
    <div class="status">
      <span class="dot"></span>
      Processing registration…
    </div>
    <a class="back" href="/">← Back to landing</a>
  </div>
</body>
</html>
